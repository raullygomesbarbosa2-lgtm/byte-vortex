name: Gerar APK de teste
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: unzip -q byte-vortex-pronto.zip
      - name: Compilar APK de teste
        working-directory: byte-vortex-pronto/android
        run: gradle assembleDebug --stacktrace
      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Byte-Vortex-APK-teste
          path: byte-vortex-pronto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp byte-vortex-pronto/android/app/build/outputs/apk/debug/app-debug.apk Byte-Vortex-teste.apk
          gh release create "teste-${GITHUB_RUN_NUMBER}" Byte-Vortex-teste.apk --title "Byte Vortex - APK de teste ${GITHUB_RUN_NUMBER}" --notes 'Versão de teste assinada com chave de debug, não destinada à publicação definitiva. Não inclui jogos, ROMs, BIOS ou emuladores. Confira a compatibilidade no seu dispositivo.' --prerelease
